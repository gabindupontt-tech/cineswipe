# ============================================================
#  CONTEXTE EN CHIFFRES (page "À propos et sources")
#  Un bloc par chiffre. Règles de l'équipe : jamais de chiffre sans source, lien et date.
#  - sources : nombre de sources INDÉPENDANTES (1 si plusieurs pages viennent de la même étude).
#  - consulte : jour où l'équipe a ouvert la page. Re-vérifie avant de publier.
